<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente Néon Kaély Verde Premium -->
    <linearGradient id="kaelyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3f553" />
      <stop offset="100%" stop-color="#72ca28" />
    </linearGradient>

    <!-- Brilho Noturno Neon -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Dark Premium -->
  <rect width="512" height="512" rx="128" fill="#0A0A0A"/>
  
  <!-- Moldura Néon Sutil -->
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#kaelyGreen)" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Monograma K 100% Verde com Efeito Néon -->
  <g filter="url(#neonGlow)">
    <!-- Coluna Esquerda Inclinada -->
    <path d="M 135 110 L 205 110 L 165 402 L 95 402 Z" fill="url(#kaelyGreen)" />

    <!-- Haste Superior Esportiva -->
    <path d="M 225 250 L 355 110 L 430 110 L 275 285 Z" fill="url(#kaelyGreen)" />

    <!-- Haste Inferior -->
    <path d="M 235 240 L 400 402 L 320 402 L 180 262 Z" fill="url(#kaelyGreen)" />

    <!-- Detalhe de Brilho de Alta Performance -->
    <path d="M 360 145 L 420 145 L 390 185 L 330 185 Z" fill="#ffffff" opacity="0.4" />
  </g>
</svg>
